# Configuração do Kernel
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Drivers de GPIO
CONFIG_GPIO=y

# Drivers de UART
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y

# Drivers de ADC
CONFIG_ADC=y
CONFIG_ADC_STM32=y

# Drivers de PWM
CONFIG_PWM=y
CONFIG_PWM_STM32=y
#===========
#CONFIG_DT_HAS_PWM_DEV_ENABLED=y

# Configurações de Console e Logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Heap
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# STM32 específico
CONFIG_CLOCK_CONTROL=y
CONFIG_PINCTRL=y

# Floating point (para cálculos do servo)
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Configurações básicas
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# Thread e sincronização
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_TIMESLICING=y
CONFIG_THREAD_STACK_INFO=y

# Heap (se necessário)
CONFIG_HEAP_MEM_POOL_SIZE=8192

# FPU para Cortex-M4
CONFIG_FPU=y
CONFIG_FPU_SHARING=y